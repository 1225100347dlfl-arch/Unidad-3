name: habla_fluido

description: Aprende inglés con un tutor de IA - pronunciación, oído, lectura y escritura.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0


# Si alguna versión ya no existe, usa: flutter pub add http flutter_tts speech_to_text shared_preferences
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true